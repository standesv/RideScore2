name: Build RideScore Android (APK + AAB)

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode signing keystore
        run: echo "${{ secrets.RIDESCORE_KEYSTORE_BASE64 }}" | base64 -d > android/app/ridescore-release.keystore

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build signed AAB (Play Store)
        working-directory: mobile-app/android
        env:
          RIDESCORE_KEYSTORE_PATH: ridescore-release.keystore
          RIDESCORE_KEYSTORE_PASSWORD: ${{ secrets.RIDESCORE_KEYSTORE_PASSWORD }}
          RIDESCORE_KEY_ALIAS: ${{ secrets.RIDESCORE_KEY_ALIAS }}
          RIDESCORE_KEY_PASSWORD: ${{ secrets.RIDESCORE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Build signed APK (test / sideload)
        working-directory: mobile-app/android
        env:
          RIDESCORE_KEYSTORE_PATH: ridescore-release.keystore
          RIDESCORE_KEYSTORE_PASSWORD: ${{ secrets.RIDESCORE_KEYSTORE_PASSWORD }}
          RIDESCORE_KEY_ALIAS: ${{ secrets.RIDESCORE_KEY_ALIAS }}
          RIDESCORE_KEY_PASSWORD: ${{ secrets.RIDESCORE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Remove keystore from workspace
        if: always()
        run: rm -f android/app/ridescore-release.keystore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ridescore-release-builds
          path: |
            mobile-app/android/app/build/outputs/bundle/release/*.aab
            mobile-app/android/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release with download links
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile-app/android/app/build/outputs/bundle/release/*.aab
            mobile-app/android/app/build/outputs/apk/release/*.apk
